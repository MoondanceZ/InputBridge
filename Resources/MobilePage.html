<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>InputBridge</title>
    <style>
        :root {
            --app-height: 100dvh;
            --bg: #e9f1fa;
            --panel: #ffffff;
            --ink: #1c2739;
            --muted: #718096;
            --line: #d8e1ec;
            --soft-line: #e9eef5;
            --accent: #1769e0;
            --accent-ink: #124f9f;
            --danger: #c13830;
            --ok: #128054;
            --surface: #f8fbff;
            --soft: #f4f7fb;
            --radius: 18px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg); height: var(--app-height); }
        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background:
                linear-gradient(180deg, rgba(248,251,255,.96) 0%, rgba(248,251,255,.74) 46%, rgba(233,241,250,.98) 100%),
                linear-gradient(135deg, #f8fbff 0%, #edf4fb 100%);
            color: var(--ink);
            height: var(--app-height);
            min-height: 0;
            display: grid;
            grid-template-rows: auto auto auto 1fr;
            overflow: hidden;
            padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
        }
        button, input, textarea { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
        .top {
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: rgba(255,255,255,.86);
            box-shadow: 0 12px 28px rgba(23,38,59,.08);
            backdrop-filter: blur(18px);
            z-index: 5;
        }
        .nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .mark {
            width: 42px;
            height: 42px;
            display: block;
            object-fit: contain;
            flex: 0 0 auto;
        }
        .title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .title strong { font-size: 20px; line-height: 1.05; font-weight: 800; color: var(--ink); letter-spacing: 0; }
        .status-box { display: flex; align-items: center; gap: 7px; min-width: 0; }
        .status-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; flex: 0 0 auto; }
        .status-dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(21,153,95,.12); }
        .status-text { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }
        .version-text { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }
        .set-btn {
            height: 38px;
            padding: 0 16px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: linear-gradient(180deg, #fff 0%, #f8fafc 100%);
            color: #1f334d;
            font-size: 14px;
            font-weight: 800;
            flex: 0 0 auto;
            box-shadow: 0 6px 14px rgba(23,38,59,.06);
        }
        .status-strip {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            margin-top: 12px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--soft);
            color: var(--muted);
            font-size: 12px;
        }
        .status-strip { display: none; }
        .paper {
            display: flex;
            flex-direction: column;
            height: 258px;
            min-height: 0;
            margin: 12px 0 0;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--panel);
            box-shadow: 0 12px 28px rgba(23,38,59,.08);
        }
        textarea {
            flex: 1;
            min-height: 0;
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            padding: 18px;
            font-size: 18px;
            line-height: 1.55;
            color: var(--ink);
            caret-color: var(--accent);
            background: #fff;
        }
        textarea::placeholder { color: #8f99a8; }
        .countline {
            display: flex;
            justify-content: flex-end;
            padding: 7px 12px 9px;
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid var(--soft-line);
            background: #f8fbff;
        }
        .bottom-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            padding: 12px 0 0;
            align-items: start;
            align-self: start;
        }
        .clear-btn, .focus-btn, .send-btn {
            width: 100%;
            min-height: 44px;
            height: 44px;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
        }
        .send-btn {
            border: 1px solid #1766d0;
            background: linear-gradient(180deg, #2477e6 0%, #1769e0 100%);
            color: #fff;
            box-shadow: 0 10px 20px rgba(23,105,224,.20);
        }
        .focus-btn {
            border: 1px solid #d6e0ec;
            background: linear-gradient(180deg, #fff 0%, #f8fbff 100%);
            color: #1f334d;
            box-shadow: 0 5px 16px rgba(23,38,59,.06);
        }
        .clear-btn {
            border: 1px solid #efc6c2;
            background: linear-gradient(180deg, #fff 0%, #fff7f6 100%);
            color: var(--danger);
        }
        .focus-btn:active, .send-btn:active, .clear-btn:active, .set-btn:active, .close-btn:active { transform: translateY(1px); }
        .modal { position: fixed; inset: 0; background: rgba(233,241,250,.72); backdrop-filter: blur(16px); display: none; align-items: flex-end; justify-content: center; z-index: 10; padding: 12px; }
        .modal.open { display: flex; }
        .modal-content { background: rgba(255,255,255,.96); padding: 18px; border-radius: 18px; width: 100%; max-width: 380px; box-shadow: 0 -10px 34px rgba(23,38,59,.14); border: 1px solid var(--line); }
        .modal-content h3 { margin-bottom: 14px; font-size: 20px; color: var(--ink); }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 44px; color: #2c3441; border-bottom: 1px solid #eef1f4; }
        .row:last-of-type { border-bottom: 0; margin-bottom: 16px; }
        .row input[type=number] { width: 82px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 10px; text-align: right; background: #fff; }
        .row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
        .close-btn { width: 100%; min-height: 42px; padding: 10px; background: var(--accent); color: white; border: 1px solid var(--accent); border-radius: 12px; font-weight: 800; }
        @media (max-height: 620px) {
            body { padding-top: 8px; }
            .top { padding: 12px; }
            .status-strip { margin-top: 7px; padding: 7px 9px; }
            .paper { margin-top: 8px; height: 218px; }
            textarea { font-size: 18px; padding: 13px; }
            .clear-btn, .focus-btn, .send-btn { min-height: 40px; padding: 8px 10px; }
        }
    </style>
</head>
<body>
    <header class="top">
        <div class="nav">
            <div class="brand">
                <img class="mark" src="/assets/app.ico" alt="">
                <div class="title">
                    <strong>InputBridge</strong>
                    <div class="status-box">
                        <div class="status-dot" id="dot"></div>
                        <span class="status-text" id="st">未连接</span>
                        <span class="version-text" id="ver">v{{appVersion}}</span>
                    </div>
                </div>
            </div>
            <button class="set-btn" onclick="openM()">设置</button>
        </div>
        <div class="status-strip">
            <span id="st_detail">增量同步已就绪</span>
            <span id="count">0 字</span>
        </div>
    </header>
    <div class="paper">
        <textarea id="tx" placeholder="点这里输入或使用手机语音输入..." enterkeyhint="enter" autofocus></textarea>
        <div class="countline"><span id="count2">当前 0 字</span></div>
    </div>
    <div class="bottom-bar">
        <button class="focus-btn" onclick="focusInput()">输入</button>
        <button class="send-btn" onclick="submitEnter()">发送</button>
        <button class="clear-btn" onclick="clearText(true)">清空</button>
    </div>
    <div class="modal" id="md" onclick="closeM()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>同步设置</h3>
            <div class="row"><span>发送延迟(ms)</span><input type="number" id="dly" value="200" min="0"></div>
            <div class="row"><span>自动清空</span><input type="checkbox" id="auto_clr" {{autoClearChecked}}></div>
            <div class="row"><span>智能感知重置</span><input type="checkbox" id="kb" {{smartChecked}}></div>
            <button class="close-btn" onclick="closeM()">完成</button>
        </div>
    </div>
    <script>
        window.appVersion = "{{appVersion}}";
        window.autoClearTime = Number("{{autoClearMs}}");
        const tx = document.getElementById('tx'), st = document.getElementById('st'),
              dot = document.getElementById('dot'), count = document.getElementById('count'),
              st_detail = document.getElementById('st_detail'), count2 = document.getElementById('count2');
        let ws, lastText = '', total = 0, ignoreLen = 0, ignoredPrefixText = '', timer, autoClearTimer, pendingEnterTimer;
        let inputVersion = 0;
        let suppressBlurSubmitUntil = 0;
        let lastViewportHeight = 0, minFocusedViewportHeight = 0, keyboardLikelyOpen = false, viewportSubmitTimer, keyboardPollTimer;
        let enterMode = localStorage.getItem('InputBridge:enterMode') || 'send';

        function currentViewportHeight(){
            return window.visualViewport ? window.visualViewport.height : window.innerHeight;
        }
        function updateViewportHeight(){
            const height = currentViewportHeight();
            document.documentElement.style.setProperty('--app-height', `${Math.max(360, height)}px`);
            detectKeyboardClose(height);
        }
        window.addEventListener('resize', updateViewportHeight);
        window.visualViewport?.addEventListener('resize', updateViewportHeight);
        window.visualViewport?.addEventListener('scroll', updateViewportHeight);
        updateViewportHeight();

        function openM(){ document.getElementById('md').classList.add('open'); }
        function closeM(){ document.getElementById('md').classList.remove('open'); syncCfg(); }
        function focusInput(){ tx.focus(); setTimeout(() => tx.scrollIntoView({block:'center'}), 80); }
        function applyEnterMode(){
            tx.setAttribute('enterkeyhint', 'enter');
        }
        function toggleEnterMode(){
            enterMode = enterMode === 'send' ? 'newline' : 'send';
            localStorage.setItem('InputBridge:enterMode', enterMode);
            applyEnterMode();
            focusInput();
        }
        function suppressBlurSubmit(){
            suppressBlurSubmitUntil = Date.now() + 500;
        }
        function startKeyboardPolling(){
            clearInterval(keyboardPollTimer);
            minFocusedViewportHeight = currentViewportHeight();
            lastViewportHeight = minFocusedViewportHeight;
            keyboardLikelyOpen = false;
            keyboardPollTimer = setInterval(() => detectKeyboardClose(currentViewportHeight()), 120);
        }
        function stopKeyboardPolling(){
            clearInterval(keyboardPollTimer);
            keyboardPollTimer = undefined;
            minFocusedViewportHeight = 0;
            keyboardLikelyOpen = false;
        }
        function detectKeyboardClose(height){
            if(!lastViewportHeight){
                lastViewportHeight = height;
                minFocusedViewportHeight = height;
                return;
            }

            const previousHeight = lastViewportHeight;
            lastViewportHeight = height;
            minFocusedViewportHeight = minFocusedViewportHeight
                ? Math.min(minFocusedViewportHeight, height)
                : height;

            const shrank = previousHeight - height > 80;
            const expanded = height - previousHeight > 80 || height - minFocusedViewportHeight > 100;
            if(shrank){
                keyboardLikelyOpen = true;
                return;
            }

            if(!keyboardLikelyOpen || !expanded || enterMode !== 'send'){
                return;
            }

            keyboardLikelyOpen = false;
            clearTimeout(viewportSubmitTimer);
            viewportSubmitTimer = setTimeout(() => {
                if(enterMode !== 'send') return;
                if(Date.now() < suppressBlurSubmitUntil) return;
                submitEnter(false);
            }, 120);
        }
        function syncCfg(){
            if(ws?.readyState===1) ws.send(JSON.stringify({
                type:'config',
                detectKeyboard:document.getElementById('kb').checked
            }));
        }
        function connect(){
            ws = new WebSocket(`ws://${location.host}/ws`);
            ws.onopen = () => { inputVersion = 0; st.innerText='已连接'; dot.className='status-dot on'; syncCfg(); };
            ws.onclose = () => { st.innerText='已断开'; dot.className='status-dot'; setTimeout(connect, 2000); };
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if(d.type==='rebase'){
                    cancelPendingActions();
                    softResetLocalInput('电脑端已发送，继续听写');
                } else if (d.type === 'config') {
                    if(d.appVersion && d.appVersion !== window.appVersion){
                        location.replace(`/?v=${encodeURIComponent(d.appVersion)}&t=${Date.now()}`);
                        return;
                    }
                    document.getElementById('auto_clr').checked = d.autoClear;
                    document.getElementById('kb').checked = d.smartDetection;
                    window.autoClearTime = d.autoClearTime * 1000;
                }
            };
        }
        tx.onfocus = () => {
            updateViewportHeight();
            startKeyboardPolling();
        };
        function updateCounts(effective){
            total += Math.max(0, effective.length - lastText.length);
            count.innerText = `${total} 字`;
            count2.innerText = `当前 ${effective.length} 字`;
        }
        function getEffectiveText(){
            if(ignoredPrefixText && tx.value.startsWith(ignoredPrefixText)){
                return tx.value.slice(ignoredPrefixText.length).replace(/^[\s\r\n，。、；：？！,.!?;:]+/, '');
            }

            return tx.value.substring(ignoreLen);
        }
        function sendDiffNow(effective){
            if(effective === lastText) return;
            if(ws?.readyState===1){
                ws.send(JSON.stringify({type:'diff', oldText:lastText, newText:effective, inputVersion}));
                updateCounts(effective);
                lastText = effective;
            }
        }
        function cancelPendingActions(){
            clearTimeout(timer);
            clearTimeout(autoClearTimer);
            clearTimeout(pendingEnterTimer);
            clearTimeout(viewportSubmitTimer);
        }
        function resetLocalInput(statusText){
            inputVersion++;
            tx.value=''; lastText=''; ignoreLen=0; ignoredPrefixText='';
            count.innerText = '0 字';
            count2.innerText = '当前 0 字';
            st_detail.innerText = statusText;
            setTimeout(()=>st_detail.innerText='实时同步中', 1500);
        }
        function softResetLocalInput(statusText){
            inputVersion++;
            ignoredPrefixText = tx.value;
            ignoreLen = tx.value.length;
            lastText = '';
            count.innerText = '0 字';
            count2.innerText = '当前 0 字';
            st_detail.innerText = statusText;
            setTimeout(()=>st_detail.innerText='实时同步中', 1500);
        }
        function submitEnter(refocus = true){
            cancelPendingActions();
            keyboardLikelyOpen = false;
            const effective = getEffectiveText().replace(/[\r\n]+$/g, '');
            sendDiffNow(effective);
            if(ws?.readyState===1) {
                ws.send(JSON.stringify({type:'enter', inputVersion}));
            }
            resetLocalInput('已执行 Enter');
            if(!refocus) stopKeyboardPolling();
            if(refocus) focusInput();
        }
        document.addEventListener('pointerdown', (e) => {
            if(e.target.closest('button, input, .modal')){
                suppressBlurSubmit();
            }
        }, true);
        tx.addEventListener('beforeinput', (e) => {
            if(e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph'){
                clearTimeout(pendingEnterTimer);
            }
        });
        tx.addEventListener('keydown', (e) => {
            if(enterMode === 'send' && e.key === 'Enter' && !e.shiftKey){
                clearTimeout(pendingEnterTimer);
            }
        });
        tx.addEventListener('blur', () => {
            if(enterMode !== 'send'){
                stopKeyboardPolling();
                return;
            }
            if(Date.now() < suppressBlurSubmitUntil){
                stopKeyboardPolling();
                return;
            }
            const beforeValue = tx.value;
            setTimeout(() => {
                if(enterMode !== 'send') return;
                if(Date.now() < suppressBlurSubmitUntil) return;
                if(tx.value !== beforeValue) return;
                submitEnter(false);
            }, 80);
        });
        tx.oninput = () => {
            clearTimeout(timer);
            const versionAtSchedule = inputVersion;
            const currentEffective = getEffectiveText();
            if(/[\r\n]/.test(currentEffective)){
                clearTimeout(pendingEnterTimer);
            }
            timer = setTimeout(() => {
                if(versionAtSchedule !== inputVersion) return;
                const effective = getEffectiveText();
                if(effective === lastText) return;
                if(ws?.readyState===1){
                    ws.send(JSON.stringify({type:'diff', oldText:lastText, newText:effective, inputVersion}));
                    updateCounts(effective);
                    lastText = effective;
                }
            }, Number(document.getElementById('dly').value || 0));
            clearTimeout(autoClearTimer);
            if(document.getElementById('auto_clr').checked) {
                autoClearTimer = setTimeout(() => {
                    if(versionAtSchedule !== inputVersion) return;
                    if(getEffectiveText() !== '') softClearText('已自动清空，继续听写');
                }, window.autoClearTime);
            }
        };
        function softClearText(statusText){
            if(ws?.readyState===1) ws.send(JSON.stringify({type:'reset', inputVersion}));
            softResetLocalInput(statusText);
        }
        function clearText(manual){
            cancelPendingActions();
            if(ws?.readyState===1) ws.send(JSON.stringify({type:'reset', inputVersion}));
            resetLocalInput(manual ? '已手动清空' : '已自动清空');
            focusInput();
        }
        applyEnterMode();
        connect();
        setTimeout(focusInput, 300);
    </script>
</body>
</html>
